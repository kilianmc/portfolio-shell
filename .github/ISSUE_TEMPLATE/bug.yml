name: Bug report
description: Report something that is broken in the portfolio shell.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If the issue is a remote failing to load, note
        whether the standalone remote site works too (helps isolate host vs. remote).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      value: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include console errors if any.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      value: |
        - Browser/OS:
        - URL (kilianmc.com / preview / localhost):
        - Remote involved (e.g. fundDashboard) and whether standalone site works:
    validations:
      required: true
